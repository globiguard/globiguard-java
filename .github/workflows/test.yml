name: Test & Lint

on:
  push:
    branches: [ sol, main, develop ]
  pull_request:
    branches: [ sol, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Run tests
        run: mvn --batch-mode --no-transfer-progress test
